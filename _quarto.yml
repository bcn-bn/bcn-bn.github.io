project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"

website:
  title: "BCN-BN"
  description: "Research community dedicated to infant development and cognition"
  favicon: /static/img/logo.png
  twitter-card: true
  site-url: https://bcn-bn.github.io/
  open-graph:
    locale: en_EN
    site-name: BCN-BN
  announcement: 
    icon: info-circle
    dismissable: true
    content: |
      **Upcoming seminar** - Beginning of December 2026 (exact date, time and location TBD). Join our [mailing list](https://forms.cloud.microsoft/e/mf9k8BVtmH) to get updates!
    type: info
    position: below-navbar
  image: "/static/img/logo.png"
  image-alt: "BCN-BN logoi"
  cookie-consent:
    style: headline
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Events"
        href: events/index.qmd
      - text: "About Us"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/bcn-babylab-network
        aria-label: GitHub
  margin-header: |
    ![](/static/img/logo.png)
footer: "© 2026 BCNBN"

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-overflow: wrap
    code-line-numbers: true
    highlight-style: github
    smooth-scroll: true
    include-in-header:
      text: |
        <meta property="og:title" content="BCN Babylab Network" />
        <meta property="og:description" content="Research community dedicated to infant development and cognition" />
        <meta property="og:type" content="website" />

filters:
  - quarto

execute:
  freeze: auto
