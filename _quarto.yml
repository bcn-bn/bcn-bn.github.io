project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"

website:
  title: "BCN Babylab Network"
  description: "Research community dedicated to infant development and cognition"
  favicon: "https://emoji.unicode.org/emoji-utility/data/emoji.json"
  
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "About Us"
        href: about.qmd
      - text: "Events"
        href: events/index.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - icon: github
        href: https://github.com/bcn-babylab-network
        aria-label: GitHub

  footer:
    left: "© 2026 BCN Babylab Network"
    center:
      - text: "About"
        href: about.qmd
      - text: "Events"
        href: events/index.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - text: "GitHub"
        href: https://github.com/bcn-babylab-network
      - text: Email
        href: "mailto:info@bcnbabylabnetwork.org"

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-overflow: wrap
    code-line-numbers: true
    highlight-style: github
    smooth-scroll: true
    include-in-header:
      text: |
        <meta property="og:title" content="BCN Babylab Network" />
        <meta property="og:description" content="Research community dedicated to infant development and cognition" />
        <meta property="og:type" content="website" />

filters:
  - quarto

execute:
  freeze: auto
